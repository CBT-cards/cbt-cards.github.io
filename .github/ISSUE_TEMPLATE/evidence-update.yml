name: Evidence / claim-scope update
description: Propose a source, mechanism-support, or limitation update
title: "Evidence: "
body:
  - type: markdown
    attributes:
      value: |
        Evidence review asks two separate questions: what does the source support, and what does it not establish? A source supporting a CBT mechanism does not automatically validate a CBT Cards short practice as treatment.
  - type: input
    id: target
    attributes:
      label: Practice, mechanism, or evidence ID
    validations: {required: true}
  - type: input
    id: source_url
    attributes:
      label: Authoritative source URL
      placeholder: https://...
    validations: {required: true}
  - type: dropdown
    id: evidence_class
    attributes:
      label: Proposed evidence class
      options:
        - guideline_supported
        - authoritative_self_help
        - clinical_resource
        - practical_editorial
        - Unsure / needs maintainer classification
    validations: {required: true}
  - type: textarea
    id: supports
    attributes:
      label: Mechanism(s) this source actually supports
      description: Use current mechanism IDs where possible and explain the connection narrowly.
    validations: {required: true}
  - type: textarea
    id: claim_scope
    attributes:
      label: Proposed claim scope
      description: State the strongest claim that is actually supported by this source.
    validations: {required: true}
  - type: textarea
    id: does_not_establish
    attributes:
      label: What this source does not establish
      description: Include important efficacy, individual-suitability, diagnosis, safety, or exact-card-format limitations.
    validations: {required: true}
  - type: textarea
    id: source_status
    attributes:
      label: Source status / date checked
      description: Note publication/review date if exposed, whether the URL is current, and when you checked it.
    validations: {required: true}
  - type: checkboxes
    id: boundaries
    attributes:
      label: Evidence boundaries
      options:
        - label: I did not infer that mechanism-level evidence proves the exact CBT Cards card/practice format is clinically validated.
          required: true
        - label: I linked to the source instead of pasting substantial copyrighted or paywalled text.
          required: true
