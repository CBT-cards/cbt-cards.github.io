name: Deploy CBT Cards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/check_site.py scripts/check_worksheets.py scripts/check_discovery.py scripts/check_changelog.py scripts/check_toolkit_review.py scripts/check_practice.py scripts/check_schemas.py scripts/check_crawl_graph.py scripts/notify_indexnow.py
      - name: Validate HTML, canonical URLs, structured data, sitemap and internal links
        run: python3 scripts/check_site.py
      - name: Validate indexed-page crawl graph and depth
        run: python3 scripts/check_crawl_graph.py
      - name: Validate worksheet schemas and canonical form pages
        run: python3 scripts/check_worksheets.py
      - name: Validate feeds and security metadata
        run: python3 scripts/check_discovery.py
      - name: Validate public changelog and resource provenance
        run: python3 scripts/check_changelog.py
      - name: Validate toolkit review and publication status
        run: python3 scripts/check_toolkit_review.py
      - name: Validate CBT Cards practice cards and metaphors
        run: python3 scripts/check_practice.py
      - name: Validate public JSON Schema contracts
        run: python3 scripts/check_schemas.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify IndexNow about changed public pages
        continue-on-error: true
        run: >-
          python3 scripts/notify_indexnow.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
