name: Deploy CBT Cards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/check_site.py scripts/check_worksheets.py scripts/check_discovery.py scripts/check_changelog.py scripts/check_toolkit_review.py scripts/check_toolkit_audit.py scripts/check_content_review.py scripts/build_semantic_review_packet.py scripts/score_semantic_reviews.py scripts/check_semantic_review_pipeline.py scripts/run_practice_semantic_openai.py scripts/check_practice_semantic_model_runner.py scripts/check_practice_semantic_execution.py scripts/check_localization.py scripts/build_localized_pages.py scripts/check_evals.py scripts/check_evals_challenge.py scripts/run_eval_baselines.py scripts/run_eval_challenge.py scripts/evaluate_model_run.py scripts/check_model_run_protocol.py scripts/run_model_openai.py scripts/score_model_execution.py scripts/check_model_runner.py scripts/check_model_run_candidate.py scripts/check_citation.py scripts/check_skill_portability.py scripts/check_schemas.py scripts/check_crawl_graph.py scripts/check_asset_budget.py scripts/check_privacy_consistency.py scripts/check_legacy_boundary.py scripts/check_mobile_locale_boundary.py scripts/check_search_distribution.py scripts/check_license_boundaries.py scripts/check_mobile_release_history.py scripts/check_project_state.py scripts/notify_indexnow.py
      - name: Validate locale registry and translation overlays
        run: python3 scripts/check_localization.py
      - name: Validate website/mobile locale scope boundary
        run: python3 scripts/check_mobile_locale_boundary.py
      - name: Validate generated localized pages and sitemap entries
        run: python3 scripts/build_localized_pages.py --check
      - name: Validate public agent evaluation cases
        run: python3 scripts/check_evals.py
      - name: Validate held-out agent evaluation challenge cases
        run: python3 scripts/check_evals_challenge.py
      - name: Validate reproducible agent eval baselines
        run: python3 scripts/run_eval_baselines.py --check
      - name: Validate held-out eval challenge baselines
        run: python3 scripts/run_eval_challenge.py --check
      - name: Validate model-run generation/scoring protocol
        run: python3 scripts/check_model_run_protocol.py
      - name: Validate isolated OpenAI model runner
        run: python3 scripts/check_model_runner.py
      - name: Validate citation metadata
        run: python3 scripts/check_citation.py
      - name: Validate portable Agent Skills distribution
        run: python3 scripts/check_skill_portability.py
      - name: Validate HTML, canonical URLs, structured data, sitemap and internal links
        run: python3 scripts/check_site.py
      - name: Validate indexed-page crawl graph and depth
        run: python3 scripts/check_crawl_graph.py
      - name: Validate worksheet schemas and canonical form pages
        run: python3 scripts/check_worksheets.py
      - name: Validate feeds and security metadata
        run: python3 scripts/check_discovery.py
      - name: Validate public changelog and resource provenance
        run: python3 scripts/check_changelog.py
      - name: Validate toolkit review and publication status
        run: python3 scripts/check_toolkit_review.py
      - name: Validate 115-record source-corpus audit
        run: python3 scripts/check_toolkit_audit.py
      - name: Validate editorial content review freshness
        run: python3 scripts/check_content_review.py
      - name: Validate semantic review blinding and scoring pipeline
        run: python3 scripts/check_semantic_review_pipeline.py
      - name: Validate frozen-context practice semantic model runner
        run: python3 scripts/check_practice_semantic_model_runner.py
      - name: Validate public JSON Schema contracts
        run: python3 scripts/check_schemas.py
      - name: Validate optimized asset references and byte budgets
        run: python3 scripts/check_asset_budget.py
      - name: Validate mobile privacy wording and store-disclosure reconciliation
        run: python3 scripts/check_privacy_consistency.py
      - name: Validate legacy-host canonical boundary and migration status
        run: python3 scripts/check_legacy_boundary.py
      - name: Validate search measurement, outreach queue and IndexNow observability
        run: python3 scripts/check_search_distribution.py
      - name: Validate current license and knowledge-record rights boundaries
        run: python3 scripts/check_license_boundaries.py
      - name: Validate store-sourced mobile release-history separation
        run: python3 scripts/check_mobile_release_history.py
      - name: Validate high-level project state against source data
        run: python3 scripts/check_project_state.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify IndexNow about changed public pages
        run: >-
          python3 scripts/notify_indexnow.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
          --receipt artifacts/indexnow-receipt.json
      - name: Upload IndexNow submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt-${{ github.run_id }}
          path: artifacts/indexnow-receipt.json
          if-no-files-found: warn
          retention-days: 30
