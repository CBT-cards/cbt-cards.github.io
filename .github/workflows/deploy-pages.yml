name: Deploy CBT Cards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, canonical URLs, JSON-LD, sitemap and internal links
        run: python3 scripts/check_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify IndexNow about changed public pages
        continue-on-error: true
        run: >-
          python3 scripts/notify_indexnow.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
