name: Practice system quality
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check practice-system helper syntax
        run: python3 -m py_compile scripts/build_practice_artifacts.py scripts/check_practice_system.py scripts/check_practice_system_strict.py scripts/check_practice_contract.py
      - name: Validate deterministic practice artifacts
        run: python3 scripts/build_practice_artifacts.py --check
      - name: Validate portable practice-system contract
        run: python3 scripts/check_practice_contract.py
      - name: Validate reviewed practice graph and cross-file integrity
        run: python3 scripts/check_practice_system.py
      - name: Validate blinded semantic review pipeline
        run: python3 scripts/check_semantic_review_pipeline.py
      - name: Validate frozen-context semantic model runner
        run: python3 scripts/check_practice_semantic_model_runner.py
