name: ARWP Growth audit

on:
  workflow_dispatch:
  schedule:
    - cron: '29 6 * * 1'

permissions:
  contents: read

jobs:
  growth-profile:
    runs-on: ubuntu-latest
    env:
      ARWP_TARGET: https://cbt-cards.github.io/
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout current ARWP
        uses: actions/checkout@v7
        with:
          repository: dkharlanau/agent-ready-web-profile
          ref: main
          path: .arwp
          persist-credentials: false

      - name: Record exact ARWP revision
        run: |
          {
            echo "target=$ARWP_TARGET"
            echo "arwp_revision=$(git -C .arwp rev-parse HEAD)"
            echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > arwp-growth-revision.txt
          cat arwp-growth-revision.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .arwp/package-lock.json

      - name: Install ARWP dependencies
        run: npm ci --prefix .arwp --ignore-scripts --no-audit --no-fund

      - name: Build current Growth Profile
        run: |
          node .arwp/bin/arwp-growth.mjs "$ARWP_TARGET" --json > arwp-growth.json
          node -e "const p=require('./arwp-growth.json'); console.log('ARWP Growth actions:', p.summary);"

      - name: Upload Growth audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: arwp-growth-profile
          path: |
            arwp-growth.json
            arwp-growth-revision.txt
          if-no-files-found: error
          retention-days: 30
