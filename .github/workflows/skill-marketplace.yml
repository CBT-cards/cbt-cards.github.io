name: Validate CBT Cards Agent Skill Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-marketplace-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check marketplace helper syntax
        run: python3 -m py_compile scripts/check_skill_marketplace.py scripts/check_toolkit_review.py scripts/check_toolkit_audit.py
      - name: Validate individual Agent Skill marketplace
        run: python3 scripts/check_skill_marketplace.py
      - name: Validate toolkit publication surfaces
        run: python3 scripts/check_toolkit_review.py
      - name: Validate source-corpus audit partition
        run: python3 scripts/check_toolkit_audit.py
      - name: Validate public JSON schemas
        run: python3 scripts/check_schemas.py
      - name: Validate site and search graph
        run: >-
          python3 scripts/check_site.py &&
          python3 scripts/check_search_release.py &&
          python3 scripts/check_crawl_graph.py
