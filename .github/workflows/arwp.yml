name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'data/**'
      - 'knowledge/**'
      - 'trust/**'
      - 'schemas/**'
      - 'agents/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply_arwp.py'
      - '.github/workflows/arwp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - 'data/**'
      - 'knowledge/**'
      - 'trust/**'
      - 'schemas/**'
      - 'agents/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply_arwp.py'
      - '.github/workflows/arwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@0d60109d0986d1f15fa30cce7bbdaec36ceb108f
        with:
          profile: ai/site-profile.json

      - name: Parse AI search, adaptive content, trust and knowledge surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              'ai/ai-search-profile.json',
              'ai/content-profile.json',
              'trust/trust.json',
              'trust/corrections.json',
              'knowledge/graph.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print(f'validated JSON: {path}')
          PY
