name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.arwp/**'
      - 'data/**'
      - 'knowledge/**'
      - 'trust/**'
      - 'schemas/**'
      - 'agents/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply_arwp.py'
      - 'scripts/apply_internal_discovery.py'
      - 'scripts/check_internal_discovery.py'
      - '.github/workflows/arwp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - '.arwp/**'
      - 'data/**'
      - 'knowledge/**'
      - 'trust/**'
      - 'schemas/**'
      - 'agents/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply_arwp.py'
      - 'scripts/apply_internal_discovery.py'
      - 'scripts/check_internal_discovery.py'
      - '.github/workflows/arwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@793483e3404a97f7892e86bcda3fd317d5c7427c
        with:
          profile: ai/site-profile.json

      - name: Parse AI search, adaptive content, trust, knowledge and ARWP surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              'ai/ai-search-profile.json',
              'ai/content-profile.json',
              'trust/trust.json',
              'trust/corrections.json',
              'knowledge/graph.json',
              '.arwp/internal-discovery.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print(f'validated JSON: {path}')
          PY
